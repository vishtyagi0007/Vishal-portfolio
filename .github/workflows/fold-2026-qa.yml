name: FOLD 2026 Creative Experience QA
on:
  pull_request:
    branches: [main]
    paths:
      - 'fold-2026/**'
      - 'tests/fold-2026*.mjs'
      - '.github/workflows/fold-2026-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-and-visual-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright browser
        run: |
          npm install --no-save playwright@1.55.1
          npx playwright install --with-deps chromium
      - name: Test physical canvas, original artwork, desktop/mobile and usability
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/fold-local-server.log 2>&1 &
          for i in {1..25}; do
            if curl -fsS http://127.0.0.1:4173/fold-2026/ >/dev/null; then break; fi
            sleep 1
          done
          node tests/fold-2026.qa.mjs
      - name: Record real browser scroll-through
        run: node tests/fold-2026-capture.mjs
      - name: Save source screenshots and motion evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fold-real-browser-desktop-mobile-motion
          path: qa-evidence/fold-2026/
          retention-days: 14
          if-no-files-found: ignore
      - name: Save interactive private prototype files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fold-private-prototype-and-qa
          path: |
            fold-2026/
            tests/fold-2026.qa.mjs
            tests/fold-2026-capture.mjs
          retention-days: 14
          if-no-files-found: error
