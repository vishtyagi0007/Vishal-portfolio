name: WOWLAB 2026 Motion-First Concept QA
on:
  pull_request:
    branches: [main]
    paths:
      - 'wowlab-2026/**'
      - 'tests/wowlab-2026.qa.mjs'
      - '.github/workflows/wowlab-2026-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  motion-prototype-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser QA environment
        run: |
          npm install --no-save playwright@1.55.1
          npx playwright install --with-deps chromium
      - name: Test three distinct motion signature prototypes
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/wowlab-2026.log 2>&1 &
          for i in {1..25}; do
            if curl -fsS http://127.0.0.1:4173/wowlab-2026/ >/dev/null; then break; fi
            sleep 1
          done
          node tests/wowlab-2026.qa.mjs
      - name: Capture actual browser desktop and mobile screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wowlab-motion-first-desktop-mobile-qa
          path: qa-screenshots/wowlab-2026/
          if-no-files-found: ignore
          retention-days: 14
      - name: Save isolated runnable concept prototypes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wowlab-three-motion-first-prototypes
          path: |
            wowlab-2026/
            tests/wowlab-2026.qa.mjs
          retention-days: 14
