name: Three VT Portfolio Concepts QA
on:
  pull_request:
    branches: [main]
    paths:
      - 'concept-lab/**'
      - 'motion-demo/**'
      - 'tests/three-concepts.qa.mjs'
      - 'tests/motion-demo.qa.mjs'
      - '.github/workflows/three-concepts-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium QA environment
        run: |
          npm install --no-save playwright@1.55.1
          npx playwright install --with-deps chromium
      - name: Verify Cinematic, Editorial and Creative Lab desktop and mobile behavior
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/three-concepts-http.log 2>&1 &
          for i in {1..25}; do
            if curl -fsS http://127.0.0.1:4173/concept-lab/ >/dev/null; then break; fi
            sleep 1
          done
          node tests/motion-demo.qa.mjs
          node tests/three-concepts.qa.mjs
      - name: Save visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: three-vt-concepts-screenshots
          path: |
            qa-screenshots/vt-motion-demo/
            qa-screenshots/three-concepts/
          if-no-files-found: ignore
          retention-days: 14
      - name: Package all three prototypes
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: three-vt-concepts-code
          path: |
            motion-demo/
            concept-lab/
          retention-days: 14
          if-no-files-found: error
